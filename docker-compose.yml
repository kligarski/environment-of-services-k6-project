version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    environment:
      - PYTHONUNBUFFERED=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - otel-collector
    networks:
      - ai-network

  mcp-server:
    build: ./mcp-server
    ports:
      - "8080:8080"
    depends_on:
      - backend
      - otel-collector
    environment:
      - BACKEND_URL=http://backend:8000
      - PYTHONUNBUFFERED=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    networks:
      - ai-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - type: bind
        source: ./observability/otel-collector/config.yaml
        target: /etc/otelcol-contrib/config.yaml
        read_only: true
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - prometheus
    networks:
      - ai-network

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - type: bind
        source: ./observability/prometheus/prometheus.yaml
        target: /etc/prometheus/prometheus.yaml
        read_only: true
    ports:
      - "9090:9090"
    command:
      [
        --web.enable-remote-write-receiver,
        --config.file=/etc/prometheus/prometheus.yaml,
      ]
    networks:
      - ai-network

  grafana:
    image: grafana/grafana:latest
    volumes:
      - type: bind
        source: ./observability/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - ai-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai-agent-frontend
    ports:
      - "8081:8081"
    environment:
      - LLM_BACKEND=${LLM_BACKEND:-gemini}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://mcp-server:8080/mcp}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      - mcp-server
      - ollama
    networks:
      - ai-network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    networks:
      - ai-network
    restart: unless-stopped

networks:
  ai-network:
    driver: bridge

volumes:
  ollama-data:
    driver: local
