services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend # Useful for development
    environment:
      - PYTHONUNBUFFERED=1

  mcp-server:
    build: ./mcp-server
    ports:
      - "8080:8080"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000
      - PYTHONUNBUFFERED=1
