apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-test-script
data:
  test.js: |
    # TODO: add k6 test script here

---
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: mcp-load-test
spec:
  parallelism: 1
  script:
    configMap:
      name: k6-test-script
      file: test.js
  runner:
    image: k6-xk6-mcp:latest
    imagePullPolicy: Never
    env:
      - name: K6_OTEL_GRPC_EXPORTER_ENDPOINT
        value: otel-collector-service:4317
      - name: K6_OTEL_GRPC_EXPORTER_INSECURE
        value: "true"
  arguments: --out experimental-opentelemetry
