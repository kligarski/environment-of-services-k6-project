apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-stress-test-normal-script
data:
  test.js: |
    import mcp from 'k6/x/mcp';
    import { check, sleep } from 'k6';

    export const options = {
      vus: 5,
      duration: '1m',
      thresholds: {
        checks: ['rate>0.95'],
        iteration_duration: ['p(95)<3000']
      },
      tags: {
        test_name: 'stress-test-normal',
      },
    };

    export default function () {
      const client = new mcp.StreamableHTTPClient({
        base_url: 'http://mcp-service:8080/mcp',
      });

      client.ping();

      client.callTool({ name: 'list_products', arguments: {} });

      client.callTool({
        name: 'get_shipping_quote',
        arguments: { items: [{ id: 1, count: 2 }] },
      });

      client.callTool({
        name: 'optimize_packaging',
        arguments: { items: [{ id: 5, "count":10}]}
      });

      sleep(1);
    }

---
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: mcp-stress-test-normal
spec:
  parallelism: 1
  script:
    configMap:
      name: k6-stress-test-normal-script
      file: test.js
  runner:
    image: k6-xk6-mcp:latest
    imagePullPolicy: Never
    env:
      - name: K6_OTEL_GRPC_EXPORTER_ENDPOINT
        value: otel-collector-service:4317
      - name: K6_OTEL_GRPC_EXPORTER_INSECURE
        value: "true"
  arguments: --out opentelemetry
