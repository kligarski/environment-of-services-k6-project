apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: mcp-list-products-load-test
spec:
  parallelism: 1
  script:
    configMap:
      name: k6-list-products-load-test-script
      file: list-products-load-test.js
  runner:
    image: k6-xk6-mcp:latest
    imagePullPolicy: Never
    env:
      - name: K6_OTEL_GRPC_EXPORTER_ENDPOINT
        value: otel-collector-service:4317
      - name: K6_OTEL_GRPC_EXPORTER_INSECURE
        value: "true"
  arguments: --out opentelemetry
