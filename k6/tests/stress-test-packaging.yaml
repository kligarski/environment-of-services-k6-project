apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-stress-test-packaging-script
data:
  test.js: |
    import mcp from 'k6/x/mcp';
    import { check, sleep } from 'k6';

    export const options = {
      stages: [
        { duration: '30s', target: 5},
        { duration: '1m', target: 10},
        { duration: '1m', target: 20},
        { duration: '30s', target: 0},
      ],
      thresholds: {
        checks: ['rate>0.90'],
        iteration_duration: ['p(95)<10000'],
      },
      tags: {
        test_name: 'stress-test-packaging',
      },
    };

    export default function () {
      const client = new mcp.StreamableHTTPClient({
        base_url: 'http://mcp-service:8080/mcp',
      });


      const packaging = client.callTool({
        name: 'optimize_packaging',
        arguments: {
          items: [
            {id: 5, count: 10},
            {id: 2, count: 5},
            {id: 1, count: 10}
          ],
        },
      });

      check(packaging, [
        (r) => String(r).includes(
          'Packaging Optimization Strategy:')
      ]);

      sleep(1);
    }

---
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: mcp-stress-test-packaging
spec:
  parallelism: 1
  script:
    configMap:
      name: k6-stress-test-packaging-script
      file: test.js
  runner:
    image: k6-xk6-mcp:latest
    imagePullPolicy: Never
    env:
      - name: K6_OTEL_GRPC_EXPORTER_ENDPOINT
        value: otel-collector-service:4317
      - name: K6_OTEL_GRPC_EXPORTER_INSECURE
        value: "true"
  arguments: --out opentelemetry
