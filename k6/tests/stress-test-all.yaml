apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-stress-test-all-script
data:
  test.js: |
    import mcp from 'k6/x/mcp';
    import { check, sleep } from 'k6';

    export const options = {
      vus: 10,
      duration: '2m',
      thresholds: {
        checks: ['rate>0.95'],
        iteration_duration: ['p(95)<5000']
      },
      tags: {
        test_name: 'stress-test-all',
      },
    };

    export default function () {
      const client = new mcp.StreamableHTTPClient({
        base_url: 'http://mcp-service:8080/mcp',
      });


      const products = client.callTool({ 
        name: 'list_products', arguments: {} 
      });

      check(products, [
        (r) => String(r).includes(
          'Catalog Products:')
      ]);



      const quote = client.callTool({
        name: 'get_shipping_quote',
        arguments: {
          items: [{ id: 1, count: 2 }],
        },
      });

      check(quote, [
        (r) => String(r).includes(
          'Available Shipping Quotes:')
      ]);


      const packaging = client.callTool({
        name: 'optimize_packaging',
        arguments: {
          items: [{ id: 5, count: 10 }],
        },
      });

      check(packaging, [
        (r) => String(r).includes(
          'Packaging Optimization Strategy:')
      ]);

      sleep(1);
    }

---
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: mcp-stress-test-all
spec:
  parallelism: 1
  script:
    configMap:
      name: k6-stress-test-all-script
      file: test.js
  runner:
    image: k6-xk6-mcp:latest
    imagePullPolicy: Never
    env:
      - name: K6_OTEL_GRPC_EXPORTER_ENDPOINT
        value: otel-collector-service:4317
      - name: K6_OTEL_GRPC_EXPORTER_INSECURE
        value: "true"
  arguments: --out opentelemetry
