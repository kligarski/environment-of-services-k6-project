apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-validation-test-script
data:
  test.js: |
    import mcp from 'k6/x/mcp';
    import { check, sleep } from 'k6';

    export const options = {
      vus: 1,
      iterations: 1,
      tags: {
        test_name: 'validation-test',
      },
    };

    export default function () {
      const client = new mcp.StreamableHTTPClient({
        base_url: 'http://mcp-service:8080/mcp',
      });

      const notFoundName = client.callTool({
        name: 'list_products',
        arguments: {
          query: 'asdsaddasdasd',
        },
      });

      check(notFoundName, [
        (r) => String(r).includes(
          'No products found matching the criteria.')
      ]);

      const invalidIDQuote = client.callTool({
        name: 'get_shipping_quote',
        arguments: {
          items: [{ id: 999999, count: 1 }],
        },
      });

      check(invalidIDQuote, [
        (r) => String(r).includes(
          'Error: One or more Product IDs were not found in the catalog. Please verify IDs using list_products.')
      ]);


      const invalidIDPacking = client.callTool({
        name: 'optimize_packaging',
        arguments: {
          items: [{ id: 999999, count: 1 }],
        },
      });

      check(invalidIDPacking, [
        (r) => String(r).includes(
          'Error: Product IDs not found. Ensure you are using valid IDs from the catalog.')
      ]);
    }

---
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: mcp-validation-test
spec:
  parallelism: 1
  script:
    configMap:
      name: k6-validation-test-script
      file: test.js
  runner:
    image: k6-xk6-mcp:latest
    imagePullPolicy: Never
    env:
      - name: K6_OTEL_GRPC_EXPORTER_ENDPOINT
        value: otel-collector-service:4317
      - name: K6_OTEL_GRPC_EXPORTER_INSECURE
        value: "true"
  arguments: --out opentelemetry
